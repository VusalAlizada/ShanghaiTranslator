plugins { id 'com.android.application' }

android {
    namespace 'com.shanghai.translator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shanghai.translator'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
